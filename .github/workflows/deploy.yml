name: CI & Deploy (Next.js SSR → Aliyun via rsync+ssh)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: biasbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门禁：无论是否配置了部署密钥都要跑，保证 PR 上有真实反馈。
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      USERNAME: ${{ secrets.USERNAME }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      TARGET: ${{ secrets.TARGET }}
      PORT: ${{ secrets.PORT || 22 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 让 git archive 基于完整树更稳定

      # 缺少任一部署密钥时跳过（而不是必然失败），便于 fork / 新分支直接复用该工作流。
      - name: Check deploy secrets
        id: guard
        run: |
          missing=""
          for k in HOST USERNAME PRIVATE_KEY TARGET; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::缺少 secrets:$missing，跳过部署"
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi

      # 用 git archive 从当前提交导出源码（不包含 .git / node_modules / .next / out）
      - name: Create source bundle (git archive)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=tar.gz -o app.tar.gz HEAD
          ls -lh app.tar.gz

      # 用原生 rsync 上传单个 tar 包到服务器 releases/<SHA>/ 目录
      - name: Upload bundle via rsync
        if: steps.guard.outputs.enabled == 'true'
        run: |
          echo "$PRIVATE_KEY" > id_rsa
          chmod 600 id_rsa
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          RSYNC_DEST="$USERNAME@$HOST:$TARGET/releases/${{ github.sha }}/"
          ssh -i id_rsa -p "$PORT" "$USERNAME@$HOST" "mkdir -p '$TARGET/releases/${{ github.sha }}'"
          rsync -az --progress -e "ssh -i id_rsa -p $PORT" app.tar.gz "$RSYNC_DEST"

      # 在服务器上：解包、安装依赖、构建、切换 current、PM2 启动/重启
      - name: Build & restart on server (native ssh)
        if: steps.guard.outputs.enabled == 'true'
        run: |
          echo "$PRIVATE_KEY" > id_rsa
          chmod 600 id_rsa
          ssh -p "$PORT" -o StrictHostKeyChecking=no -i id_rsa "$USERNAME@$HOST" << 'EOF'
            set -euo pipefail

            APP_DIR="${{ secrets.TARGET }}"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            CURRENT_DIR="$APP_DIR/current"
            SHARED_DIR="$APP_DIR/shared"

            # 如果服务器使用 nvm，可加载 Node 20（没有也不报错）
            if [ -s "$HOME/.nvm/nvm.sh" ]; then
              . "$HOME/.nvm/nvm.sh"
              nvm use 20 >/dev/null 2>&1 || true
            fi

            cd "$RELEASE_DIR"

            # 解压 CI 上传的源码包
            tar -xzf app.tar.gz
            rm -f app.tar.gz

            # 绑定共享环境变量（可选）
            if [ -f "$SHARED_DIR/.env" ]; then
              ln -sf "$SHARED_DIR/.env" .env
            fi

            # 安装依赖并构建
            npm ci
            npm run build

            # 原子切换 current -> 新版本
            ln -sfn "$RELEASE_DIR" "$CURRENT_DIR"

            # PM2 启动/重启（要求 package.json: start 使用 -p 3000）
            cd "$CURRENT_DIR"
            pm2 describe biasbench >/dev/null 2>&1 \
              && pm2 restart biasbench \
              || pm2 start "npm -- start" --name biasbench --time --cwd "$CURRENT_DIR"

            pm2 save
            pm2 status biasbench
          EOF

  # 密钥一旦 commit 进历史就很难清干净（science-pop 就漏过一个 Coze PAT）。
  # 这里只匹配高置信度的前缀，不做熵分析，避免把 CI 变成误报噪音。
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed credentials
        run: |
          python3 - <<'PY'
          import re, subprocess, sys

          PATTERNS = [
              ("GitHub token", re.compile(r"\b(ghp|gho|ghu|ghs|ghr)_[0-9A-Za-z]{20,}\b")),
              ("GitHub fine-grained PAT", re.compile(r"\bgithub_pat_[0-9A-Za-z_]{30,}\b")),
              ("OpenAI-style key", re.compile(r"\bsk-[0-9A-Za-z_-]{20,}\b")),
              ("AWS access key", re.compile(r"\bAKIA[0-9A-Z]{16}\b")),
              ("Slack token", re.compile(r"\bxox[baprs]-[0-9A-Za-z-]{10,}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{30,}\b")),
              ("WeChat app secret", re.compile(
                  r"(?i)\b(wxappsecret|wx_app_secret|app_secret)\b\s*[:=]\s*['\"]?([0-9a-f]{32})['\"]?")),
              ("Coze PAT", re.compile(r"\bpat_[0-9A-Za-z]{20,}\b")),
          ]
          SKIP = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".ico", ".pdf", ".zip", ".gz",
                  ".pkl", ".pt", ".pth", ".ckpt", ".onnx", ".bin", ".dll", ".so", ".pdb",
                  ".docx", ".hdr", ".ttf", ".woff", ".woff2", ".mp3", ".mp4", ".wav", ".h5",
                  ".safetensors", ".lock", ".whl", ".jar", ".class"}

          files = subprocess.run(["git", "ls-files", "-z"], capture_output=True,
                                 text=True).stdout.split("\0")
          hits = []
          for name in filter(None, files):
              if name.endswith(tuple(SKIP)):
                  continue
              try:
                  blob = open(name, "rb").read(2 * 1024 * 1024)
              except OSError:
                  continue
              if b"\0" in blob:
                  continue
              text = blob.decode("utf-8", "replace")
              for label, pat in PATTERNS:
                  for m in pat.finditer(text):
                      hits.append(f"{label}: {name}: {m.group(0)[:24]}")
          if hits:
              print("\n".join(hits))
              sys.exit("发现疑似明文密钥（见上）；确认是误报就把该文件加进 SKIP 或换成占位符")
          print(f"ok  已扫描 {len([f for f in files if f])} 个文件，未发现明文密钥")
          PY
